# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    ignore_title_keywords:
      - "WIP"
      - "Draft"
    drafts: false
    base_branches:
      - "main"
      - "master"
  path_filters:
    - "!dist/**"
    - "!build/**"
    - "!node_modules/**"
    - "!package-lock.json"
  auto_summary:
    enabled: true
chat:
  auto_reply: true
